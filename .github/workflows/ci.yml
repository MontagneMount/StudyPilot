name: StudyPilot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run syntax & lint check
        run: npm run lint

      - name: Run automated unit & integration tests (M1-M6)
        run: npm test

      - name: Run 50-question RAG evaluation benchmark
        run: npm run eval
